# GoReleaser configuration (v2 schema), pinned to GoReleaser v2.20.2: the
# version `make release-snapshot` runs with `go run`, so it never enters
# go.mod.
#
#   make release-snapshot   local dry run: binaries, archives, checksums and
#                           SBOMs in dist/, no images, nothing published
#
# A release is cut from a tag (git tag v0.1.0) by CI
# (.github/workflows/release.yml, written but never run yet), which runs
# make check and then
#
#   go run github.com/goreleaser/goreleaser/v2@v2.20.2 release --clean
#
# on a runner with Docker Buildx and QEMU set up (docker/setup-qemu-action
# and docker/setup-buildx-action), logged in to ghcr.io
# (docker/login-action with GITHUB_TOKEN and packages: write), and with
# GITHUB_TOKEN for the GitHub release. The repository is
# github.com/itszarmik/Switchyard; a fork changes the owner here, in the
# image labels of deploy/Dockerfile and in the alerts' runbook URLs. Image
# names on ghcr.io must be lowercase.
version: 2

project_name: switchyard

before:
  hooks:
    - go mod download

builds:
  # The gateway: static, reproducible (trimmed paths, commit timestamp) and
  # with the same version metadata as `make build`.
  - id: switchyard
    main: ./cmd/switchyard
    binary: switchyard
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X switchyard/internal/version.Version=v{{ .Version }}
      - -X switchyard/internal/version.Commit={{ .ShortCommit }}
      - -X switchyard/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: switchyard
    ids: [switchyard]
    formats: [tar.gz]
    # switchyard_0.1.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - docs/quickstart.md
      - docs/configuration.md
      - docs/runbook.md
      - configs/quickstart.yaml
      - configs/switchyard.example.yaml
      - configs/catalog/*

# One CycloneDX SBOM per archive, generated from the Go build information
# embedded in the archive's binary (cyclonedx-gomod bin), so it lists
# exactly the modules linked in. cyclonedx-gomod runs with `go run` at a
# pinned version, like GoReleaser itself; GoReleaser runs it in dist/.
sboms:
  - id: switchyard
    artifacts: binary
    ids: [switchyard]
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.cdx.json"
    cmd: go
    args:
      - run
      - github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - bin
      - -json
      - -std
      - -version
      - "v{{ .Version }}"
      - -output
      - "$document"
      - "$artifact"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The Helm chart (release.extra_files) is checksummed with the rest.
  extra_files:
    - glob: &chart '{{ if not .IsSnapshot }}./bin/chart/switchyard-{{ .Version }}.tgz{{ end }}'

# Multi-arch images on ghcr.io, built with Buildx from the binaries above
# (deploy/Dockerfile.release), with an SBOM and provenance attestation.
# `make release-snapshot` skips them (--skip=docker) because they need
# Buildx; CI builds and pushes them on a tag.
dockers_v2:
  - id: switchyard
    ids: [switchyard]
    dockerfile: deploy/Dockerfile.release
    images:
      - ghcr.io/itszarmik/switchyard
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - configs/quickstart.yaml
    labels:
      org.opencontainers.image.title: switchyard
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.source: https://github.com/itszarmik/Switchyard
    sbom: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: itszarmik
    name: Switchyard
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
  # The Helm chart at the tag's version: release.yml's check job packages it
  # (make helm-package) and the release job downloads it into bin/chart,
  # which --clean leaves alone. A snapshot has no chart: the glob is empty,
  # which GoReleaser skips.
  extra_files:
    - glob: *chart
