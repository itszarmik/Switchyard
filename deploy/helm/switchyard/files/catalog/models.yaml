# Switchyard model catalog, included by configs/switchyard.example.yaml.
#
# Curated for Phase 2 and checked on 2026-11-11 against each provider's
# official pricing and model pages. configs/catalog/README.md lists the
# sources, the decisions behind each capability list, and what could not
# be verified.
#
# Conventions:
#   - Prices are USD per 1M tokens, written as strings so the exact decimal
#     text is kept. A price that is not written is unknown, and routing
#     ranks that deployment last.
#   - cached_input is the provider's cache-read (cache hit) price.
#     cache_write is the price of writing tokens to the cache, set only
#     where the provider charges one per token.
#   - Where a provider has several price tiers, the default tier is used
#     (standard tier, shortest prompt band, default cache lifetime). The
#     comment on each deployment names the tiers that are not modelled.
#   - A capability is listed only when the provider documents it for this
#     model on the endpoint Switchyard calls (Chat Completions for the
#     openai adapter, the Messages API for the anthropic adapter).
#     Undocumented means not listed.
#   - Quality priors are STARTING ESTIMATES (DESIGN §10.2), not
#     measurements. Only `general` is set; the other categories fall back
#     to it. Each value is the Artificial Analysis Intelligence Index for
#     the model at its default reasoning effort (high where no default is
#     documented), divided by 70 and rounded to two places. Source and the
#     raw scores are in README.md.
#   - context_window is the provider's total (input + output) limit, and
#     max_output_tokens its per-response output limit.
models:
  # ---------------------------------------------------------------- OpenAI
  # The GPT-6 family. Source for IDs, limits and features: the model pages
  # under https://developers.openai.com/api/docs/models/ and the GPT-6 guide
  # https://developers.openai.com/api/docs/guides/latest-model.
  #
  # Capabilities that are deliberately NOT listed for GPT-6 models:
  #   - tools, parallel_tools: OpenAI documents that GPT-6 Astra and
  #     GPT-6.1 Sol support tool calling only through the Responses API,
  #     and that GPT-6 Luna supports function calling in Chat Completions
  #     only with reasoning_effort "none" (its default is "medium").
  #     Switchyard speaks Chat Completions, so none of the three is declared
  #     tool-capable.
  #   - sampling, temperature_2, logprobs: the GPT-6 guide says to remove
  #     temperature, top_p, top_logprobs and logprobs when reasoning effort
  #     is not "none". Astra and Sol have no "none" level, and Luna's
  #     default is "medium". Without sampling the gateway always removes
  #     temperature and top_p before forwarding.
  #   - forced_tools: tools are not declared (above), so neither is forcing
  #     a tool call.
  #   - n, seed, penalties: not documented for GPT-6.
  #   - completions: the model pages mark v1/completions as not supported.
  # json_mode is listed because the Chat Completions reference documents
  # response_format json_object without a per-model restriction; the model
  # pages themselves list only "structured outputs" (json_schema).

  # Small: GPT-6 Luna, "our most efficient model".
  - id: gpt-6-luna
    context_window: 1050000   # maximum input is 922,000 of these
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.26 }   # starting estimate: AA index 18 (medium)
    deployments:
      - provider: openai
        upstream_model: gpt-6-luna
        # Standard tier, prompts up to 272K input tokens. Over 272K, OpenAI
        # bills the whole request at 2x input/cache rates and 1.5x output.
        # cache_write is the default 30-minute lifetime (1.25x input).
        pricing:
          input: "0.10"
          output: "0.50"
          cached_input: "0.01"
          cache_write: "0.125"
          source: https://developers.openai.com/api/docs/pricing
          checked: "2026-11-11"

  # Mid: GPT-6.1 Sol, "near-Astra performance ... at a lower cost".
  - id: gpt-6.1-sol
    context_window: 1050000   # maximum input is 922,000 of these
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.66 }   # starting estimate: AA index 46 (medium)
    deployments:
      - provider: openai
        upstream_model: gpt-6.1-sol
        # Standard tier, prompts up to 272K input tokens (long context:
        # input 4.00, cached 0.20, output 15.00). 30-minute cache writes.
        pricing:
          input: "2.00"
          output: "10.00"
          cached_input: "0.10"
          cache_write: "2.50"
          source: https://developers.openai.com/api/docs/pricing
          checked: "2026-11-11"

  # Frontier: GPT-6 Astra, "our most capable model".
  - id: gpt-6-astra
    context_window: 1050000   # maximum input is 922,000 of these
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.79 }   # starting estimate: AA index 55 (high; no documented default)
    deployments:
      - provider: openai
        upstream_model: gpt-6-astra
        # Standard tier, prompts up to 272K input tokens (long context:
        # input 20.00, cached 2.00, output 75.00). 30-minute cache writes.
        pricing:
          input: "10.00"
          output: "50.00"
          cached_input: "1.00"
          cache_write: "12.50"
          source: https://developers.openai.com/api/docs/pricing
          checked: "2026-11-11"

  # Embeddings. 1536 dimensions by default and 8192 input tokens, from
  # https://developers.openai.com/api/docs/guides/embeddings.
  - id: text-embedding-3-small
    type: embedding
    context_window: 8192
    dimensions: 1536
    deployments:
      - provider: openai
        upstream_model: text-embedding-3-small
        pricing:
          input: "0.02"
          source: https://developers.openai.com/api/docs/pricing
          checked: "2026-11-11"

  # ------------------------------------------------------------- Anthropic
  # The current lineup from
  # https://platform.claude.com/docs/en/about-claude/models/overview: every
  # model has a 1M-token context window and 128K max output, and accepts
  # images and tools. Claude Mythos 5.2 is left out because it is limited to
  # verified organizations.
  #
  # Capabilities follow the anthropic adapter's mapping (DESIGN §6.2):
  # stream_usage is listed because the adapter itself emits the usage
  # chunk; json_schema uses native structured outputs, which the
  # structured-outputs page documents for all four models. n, logprobs,
  # seed, penalties and temperature_2 have no Messages API equivalent, and
  # there is no legacy completions endpoint.
  #
  # json_mode is listed for all four. The adapter emulates
  # response_format json_object with a system-prompt instruction, never
  # with a forced tool, so it works on models that reject forced tools.
  # It is an instruction, not a guarantee: unlike OpenAI's JSON mode, the
  # output is not constrained to valid JSON. Use json_schema (native
  # structured outputs) when validity matters.
  #
  # forced_tools (tool_choice "required" or a named function, which the
  # adapter maps to {type: any} and {type: tool}) is listed only for
  # Haiku 5.5. Fable 5.2, Opus 5.5 and Sonnet 5.5 reject a forced
  # tool_choice with a 400, so the gateway never sends such a request to
  # them.
  #
  # sampling is not listed for any of the four. Opus 5.5 and the Fable
  # family reject temperature and top_p, and Sonnet 5.5 and Haiku 5.5
  # reject non-default values, so the gateway removes both parameters
  # before forwarding.
  #
  # cache_write is the 5-minute cache write price (1-hour writes cost more
  # and are not modelled).

  - id: claude-fable-5-2
    context_window: 1000000
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, tools, parallel_tools, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.89 }   # starting estimate: AA index 62 (high, the default)
    deployments:
      - provider: anthropic
        upstream_model: claude-fable-5-2
        # Requires 30-day data retention: organizations on zero data
        # retention get 400 invalid_request_error.
        pricing:
          input: "8.00"
          output: "40.00"
          cached_input: "0.20"
          cache_write: "10.00"
          source: https://platform.claude.com/docs/en/about-claude/pricing
          checked: "2026-11-11"

  - id: claude-opus-5-5
    context_window: 1000000
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, tools, parallel_tools, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.69 }   # starting estimate: AA index 48 (medium, the default)
    deployments:
      - provider: anthropic
        upstream_model: claude-opus-5-5
        pricing:
          input: "4.00"
          output: "20.00"
          cached_input: "0.20"
          cache_write: "5.00"
          source: https://platform.claude.com/docs/en/about-claude/pricing
          checked: "2026-11-11"

  - id: claude-sonnet-5-5
    context_window: 1000000
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, tools, parallel_tools, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.60 }   # starting estimate: AA index 42 (high, the default)
    deployments:
      - provider: anthropic
        upstream_model: claude-sonnet-5-5
        pricing:
          input: "2.00"
          output: "10.00"
          cached_input: "0.10"
          cache_write: "2.50"
          source: https://platform.claude.com/docs/en/about-claude/pricing
          checked: "2026-11-11"

  - id: claude-haiku-5-5
    context_window: 1000000
    max_output_tokens: 128000
    capabilities: [streaming, stream_usage, tools, parallel_tools, forced_tools, vision, json_mode, json_schema, prompt_caching]
    quality: { general: 0.36 }   # starting estimate: AA index 25 (medium, the default)
    deployments:
      - provider: anthropic
        upstream_model: claude-haiku-5-5
        # Prompts up to 100,000 tokens. A request whose prompt is over
        # 100,000 tokens is billed at input 0.50, 5m cache write 0.625,
        # cache hit 0.05 and output 2.50 instead.
        pricing:
          input: "0.10"
          output: "0.50"
          cached_input: "0.01"
          cache_write: "0.125"
          source: https://platform.claude.com/docs/en/about-claude/pricing
          checked: "2026-11-11"

  # ---------------------------------------------------------------- Google
  # Gemini through the OpenAI-compatible endpoint (provider type openai).
  # Limits and features from https://aistudio.google.com/docs/models/<id>.
  # Endpoint behavior from https://aistudio.google.com/docs/openai, which
  # says OpenAI library support "is still in beta".
  #
  # stream_usage: listed. Google's compatibility page passes
  # stream_options={'include_usage': True} in its streaming example, and the
  # compatibility reference documents StreamOptions.includeUsage. Forum
  # reports say usage may appear on every chunk, not only the last, so the
  # gateway should keep the last usage it sees rather than summing (it
  # does: the openai adapter keeps the last usage of a stream).
  # sampling: NOT listed. Google's model guides say Gemini 3.6+ and
  # Gemini 4 ignore custom temperature, top_p and top_k (the Gemini 4
  # Carbon guide: remove them, "which are ignored"; Google warns they may
  # return 400 in a future release), so the gateway removes them.
  # forced_tools: NOT listed. The AI Studio compatibility page shows only
  # tool_choice "auto". Google's Vertex (Agent Platform) OpenAI endpoint
  # documents "required" (mode ANY) but not a named function, and it is a
  # different endpoint from the one configured here.
  # Not listed because the compatibility page does not document them:
  # parallel_tools, json_mode (json_object), n, logprobs, seed, penalties,
  # temperature_2, completions, and prompt_caching (cached-token reporting
  # through this endpoint is not documented, although the native API
  # caches implicitly).
  #
  # cache_write is unset: Gemini does not charge per token to write a
  # cache. Explicit caches are billed for storage per token-hour, which the
  # schema does not model; implicit caching has no write charge.

  - id: gemini-3.8-flash
    context_window: 1048576   # input limit; output limit is 65,536
    max_output_tokens: 65536
    capabilities: [streaming, stream_usage, tools, vision, json_schema]
    quality: { general: 0.44 }   # starting estimate: AA index 31 (high; default not documented)
    deployments:
      - provider: google
        upstream_model: gemini-3.8-flash
        # Paid tier, standard. PRICE CHANGE: Google lists these prices
        # "through December 31, 2026"; from January 1, 2027 they are
        # input 1.50, output 7.50, context caching 0.15. Update then.
        pricing:
          input: "0.75"
          output: "3.75"
          cached_input: "0.075"
          source: https://aistudio.google.com/docs/pricing
          checked: "2026-11-11"

  - id: gemini-4-carbon
    context_window: 1048576   # unified input and output limit
    max_output_tokens: 65536  # synchronous default; up to 1,048,576 with long decode
    capabilities: [streaming, stream_usage, tools, vision, json_schema]
    quality: { general: 0.86 }   # starting estimate: AA index 60 (high; default not documented)
    deployments:
      - provider: google
        upstream_model: gemini-4-carbon
        # Paid tier only, standard. PRICE CHANGE: Google lists these prices
        # "through November 30, 2026"; from December 1, 2026 they are
        # input 4.00, output 20.00, context caching 0.20. Update then.
        # Implicit caching only.
        pricing:
          input: "2.00"
          output: "10.00"
          cached_input: "0.10"
          source: https://aistudio.google.com/docs/pricing
          checked: "2026-11-11"

  # ------------------------------------------------------------ Open weight
  # Qwen3.5 9B: Apache-2.0 weights at https://huggingface.co/Qwen/Qwen3.5-9B,
  # a vision-language model with a native 262,144-token context. It thinks
  # by default. The model card recommends an output length of 32,768 tokens
  # but states no hard output limit, so max_output_tokens is unknown (0).
  #
  # No quality prior: Artificial Analysis lists no Intelligence Index for
  # this model, and the model card's self-reported scores are not
  # comparable with the index used above.
  #
  # The model-level capabilities are Together's. Together documents
  # function calling and structured outputs for this model in its model
  # table, and uses Qwen/Qwen3.5-9B in its JSON-schema, logprobs and
  # parallel-function-calling examples. Its chat reference documents
  # temperature, top_p and tool_choice "required" or a named function, so
  # sampling and forced_tools are listed. Not listed for Together:
  #   - stream_usage: stream_options is not in Together's chat reference.
  #   - temperature_2: the reference documents temperature as 0-1.
  #   - logprobs: Together takes an integer, not OpenAI's boolean, and
  #     returns its own response shape.
  #   - n: "supported on most chat models but not on every model".
  #   - prompt_caching: no cached-input price is listed for this model.
  #   - completions: not documented for this model.
  - id: qwen3.5-9b
    context_window: 262144
    capabilities: [streaming, tools, parallel_tools, forced_tools, vision, json_mode, json_schema, seed, sampling, penalties]
    deployments:
      - provider: together
        upstream_model: Qwen/Qwen3.5-9B
        # Served at FP8 per Together's model table. No cached-input price.
        pricing:
          input: "0.17"
          output: "0.25"
          source: https://docs.together.ai/docs/serverless/models
          checked: "2026-11-11"

      # Self-hosted vLLM serving the BF16 weights: commented out until you
      # set its price. An amortized self-hosted price depends on your GPU
      # cost, utilization and throughput, none of which can be checked
      # against a provider page, so this file does not invent one; an
      # unpriced deployment would rank last and fail `switchyard catalog
      # lint`. Compute it as
      #   (GPU $/hour x GPUs) / (sustained tokens/sec x 3600 x utilization) x 1e6
      # (README.md has a worked example), then uncomment the entry.
      #
      # Start the server with the model card's command plus the tool flags:
      #   vllm serve Qwen/Qwen3.5-9B --max-model-len 262144 \
      #     --reasoning-parser qwen3 \
      #     --enable-auto-tool-choice --tool-call-parser qwen3_coder
      # These capabilities come from vLLM's request schema
      # (vllm/entrypoints/openai/chat_completion/protocol.py and
      # vllm/sampling_params.py, which bounds temperature to [0, 2]; the
      # schema accepts tool_choice "required" and named functions).
      # Add prompt_caching only if the server runs with
      # --enable-prompt-tokens-details; without it cached_tokens is null.
      #
      # - provider: gpu-cluster
      #   upstream_model: Qwen/Qwen3.5-9B
      #   capabilities: [streaming, stream_usage, tools, parallel_tools, forced_tools, vision, json_mode, json_schema, n, logprobs, seed, sampling, temperature_2, penalties, completions]
      #   pricing:
      #     input: "<amortized USD per 1M tokens>"
      #     output: "<amortized USD per 1M tokens>"
      #     source: <URL of your cost sheet>
      #     checked: "<YYYY-MM-DD>"
