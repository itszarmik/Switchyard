{{- if .Values.secrets.create }}
# secrets.env, loaded by the pods with envFrom. The only object that holds
# secret values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "switchyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
data:
  {{- range $k, $v := .Values.secrets.env }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
