# Prometheus for deploy/compose.yaml (profile observability). It scrapes the
# gateway's admin listener, whose /metrics stays open when an admin token is
# set, and evaluates the alert rules in alerts.yml. Add an
# alerting.alertmanagers section to route the alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: switchyard
    metrics_path: /metrics
    static_configs:
      # With several replicas, list each one's admin address here.
      - targets: ["gateway:9090"]
