# Development dependencies for Switchyard: two Redis instances and Postgres.
# This file does not run the gateway itself.
#
#   make dev-up     start and wait until every service is healthy
#   make dev-down   stop (add -v to the compose command to delete the data)
#
# DEV ONLY. Nothing here is hardened: Redis has no password, and Postgres
# uses throwaway credentials. Ports bind to 127.0.0.1 so they are not
# reachable from other machines.
name: switchyard-dev

services:
  # Evictable cache (DESIGN §11.5): bounded memory, least-recently-used keys
  # are evicted, and nothing is persisted.
  redis-cache:
    image: redis:8
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Non-evictable state (budgets, limits): writes fail rather than evict, and
  # the append-only file survives restarts.
  redis-state:
    image: redis:8
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-state-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Usage ledger. Host port 5433, because 5432 is often taken by a local
  # (for example Homebrew) Postgres.
  postgres:
    image: postgres:17
    environment:
      # DEV ONLY: throwaway credentials for a local database. Never reuse them.
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: switchyard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  redis-state-data:
  postgres-data:
