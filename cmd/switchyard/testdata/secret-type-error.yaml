# Secret references expanded into fields of the wrong type. The errors must
# name the references, never the values.
version: 1

server:
  max_request_bytes: ${REDIS_CACHE_URL}
  idle_timeout: ${DATABASE_URL}

storage:
  mode: redis
  redis:
    cache_url: ${REDIS_CACHE_URL}
    state_url: ${REDIS_STATE_URL}
  ledger:
    driver: postgres
    dsn: ${DATABASE_URL}

providers:
  - id: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    max_concurrency: ${OPENAI_API_KEY}
  - id: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    timeouts:
      connect: ${ANTHROPIC_API_KEY}

models:
  - id: gpt-5-mini
    deployments:
      - provider: openai
        upstream_model: gpt-5-mini
