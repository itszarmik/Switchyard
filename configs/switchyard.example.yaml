# Switchyard reference configuration.
#
# Every key Phase 5 understands, with its default. The layout mirrors
# docs/DESIGN.md §16.3. Later phases add sections (cache); until then, any
# other key is rejected at load time.
# CI validates this file with `switchyard config validate`.
#
# Values may reference the environment or files:
#   ${VAR}              required environment variable; an error if unset
#   ${VAR:-default}     environment variable, or the default when unset
#   ${file:/path}       contents of a file, e.g. a Docker or Kubernetes secret
# Never write secrets literally into a config file.
#
# Precedence, lowest to highest: built-in defaults, this file and its
# includes, the SWITCHYARD_LISTEN, SWITCHYARD_ADMIN_LISTEN and
# SWITCHYARD_LOG_LEVEL environment variables, then CLI flags.
#
# Validating this file needs DATABASE_URL and the four provider API keys set.

# Schema version. Required; only 1 is defined.
version: 1

# Glob patterns of additional files, relative to this file's directory.
# Included files may define only providers, models and aliases; list
# entries are appended in sorted file-name order, and a duplicate ID or an
# alias defined twice is an error. The model catalog lives in
# configs/catalog/ (see configs/catalog/README.md); check its prices and
# sources with `switchyard catalog lint`.
include:
  - catalog/*.yaml

server:
  # Public API address (host:port). Default ":8080".
  listen: ":8080"
  # Address for /metrics and /admin/v1/*. Default "127.0.0.1:9090".
  # Keep it private: it must never be reachable from the internet.
  admin_listen: "127.0.0.1:9090"
  # Largest accepted request body; larger bodies get 413. Default 10MiB.
  # Sizes are an integer number of bytes, or a number with a unit:
  # B, KB, MB, GB (powers of 1000) or KiB, MiB, GiB (powers of 1024).
  max_request_bytes: 10MiB
  # Largest accepted request headers; larger headers get 431. Default 64KiB.
  # net/http allows up to 4 KiB beyond this before it rejects them.
  max_header_bytes: 64KiB
  # How long a client may take to send its request headers. Default 10s.
  # Durations are Go duration strings, such as 500ms, 60s or 2m30s.
  read_header_timeout: 10s
  # How long a client may take to send a request body; a slower one gets
  # 408. Default 60s.
  body_read_timeout: 60s
  # How long each write to an API client may take: a whole JSON response, or
  # one streamed event. A client that stops reading longer is disconnected,
  # which cancels its upstream call. Time spent writing to the client never
  # counts toward a provider's idle timeout. Default 60s.
  write_timeout: 60s
  # Idle keep-alive connections are closed after this long. Default 120s.
  idle_timeout: 120s
  # After SIGTERM, keep serving this long while /readyz already fails, so
  # load balancers stop routing here first. Default 0s; set it to a few
  # seconds behind a load balancer.
  shutdown_delay: 5s
  # How long in-flight requests may take to finish once the listeners have
  # closed. Default 60s.
  shutdown_grace: 60s

logging:
  # debug | info | warn | error. Default info.
  level: info
  # json | text. Default json.
  format: json

# State backends.
storage:
  # memory (quickstart and dev only; state is lost on restart) | redis.
  # Default memory. With redis, budget counters live in the state instance
  # and are shared by every replica; with memory they are per process.
  mode: redis
  # Two Redis roles (DESIGN §11.5). Both are required in redis mode. The
  # URLs are secrets because they may embed passwords. `make dev-up` starts
  # matching instances on ports 6379 and 6380.
  redis:
    # Evictable cache instance (maxmemory-policy allkeys-lru).
    cache_url: ${REDIS_CACHE_URL:-redis://localhost:6379/0}
    # Non-evictable state instance for budgets and limits
    # (maxmemory-policy noeviction). A single server or a failover pair, not
    # a Cluster. It may be down at startup: budgets then follow
    # budgets.fail_mode. With fail_mode closed, /readyz fails its
    # budget_store check while it is down; with open, /admin/v1/providers
    # reports it.
    state_url: ${REDIS_STATE_URL:-redis://localhost:6380/0}
  # The usage ledger: one event per request (DESIGN §12.2).
  ledger:
    # memory (the latest 100,000 events, per process) | postgres.
    # Default memory.
    driver: postgres
    # Postgres connection string, a secret. Required when driver is postgres.
    # Postgres must be reachable at startup, when the ledger applies its
    # migrations; after that, outages are buffered in memory.
    # `make dev-up` starts one on port 5433.
    dsn: ${DATABASE_URL}
    # Events per batch written with COPY. Default 500.
    batch_size: 500
    # The longest an event waits before its batch is written. Default 1s.
    flush_interval: 1s
    # Events buffered in memory while Postgres is slow or down; when full,
    # the oldest are dropped and counted in
    # switchyard_usage_events_dropped_total. Default 100000.
    queue_size: 100000

# Upstream endpoints and their credentials. Keys per provider:
#   id               names the provider in deployment IDs (model@provider)
#   type             wire protocol: openai (OpenAI and every OpenAI-compatible
#                    upstream) | anthropic
#   base_url         absolute http(s) API root; must not embed credentials
#   api_key          upstream credential, a secret; optional for self-hosted
#   tags             matched by policies, e.g. self_hosted, zdr, region_eu
#   max_concurrency  in-flight requests per replica; 0 (default) is unlimited.
#                    A saturated provider is skipped, so traffic spills over
#                    to the next cheapest deployment; with none left the
#                    answer is 503 no_healthy_upstream
#   forward_headers  client headers that may be forwarded upstream; none by
#                    default, and Authorization and Cookie never are
#   timeouts         connect (default 5s); first_token (default 30s), the wait
#                    for a stream's first event: streams only, since a
#                    non-streaming response arrives after the whole
#                    generation; idle, the gap between streamed chunks
#                    while the gateway waits for the upstream (default
#                    60s); and total, the whole upstream call (default 10m).
#                    A non-streaming call over total falls back without a
#                    retry on the same deployment
providers:
  - id: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  - id: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    # Client headers are not forwarded unless listed.
    forward_headers: [anthropic-beta]

  # Gemini through Google's OpenAI-compatible endpoint.
  - id: google
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY}

  - id: together
    type: openai
    base_url: https://api.together.xyz/v1
    api_key: ${TOGETHER_API_KEY}

  # Self-hosted vLLM: no API key, tagged so policies can require it.
  - id: gpu-cluster
    type: openai
    base_url: http://vllm.internal:8000/v1
    tags: [self_hosted, zdr]
    # Per replica; when saturated, traffic spills over to other deployments.
    max_concurrency: 64
    timeouts:
      connect: 2s
      first_token: 20s
      idle: 30s

# Models come from the included catalog (configs/catalog/models.yaml).
# Each model has an id (what clients send in the "model" field), a type
# (chat, the default, or embedding), limits, capabilities and a list of
# deployments, each with a provider (a provider id above), the
# upstream_model name sent to that provider and its pricing. A request is
# only sent to a deployment that has every capability it needs; among
# those, the cheapest serves it. "model@provider" pins one deployment.

# Aliases: extra model names clients may send. Each maps to a catalog
# model id, a pinned deployment (model@provider), or a virtual model:
# auto or auto:<profile>, which routes across every model the caller's
# policy allows. Alias names follow the model id rules and must not
# collide with a model id. Default none.
aliases:
  fast: claude-haiku-5-5
  smart: claude-opus-5-5
  gpt: gpt-6.1-sol@openai
  code-review: auto:quality

routing:
  # Remove optional parameters a deployment cannot honor (n, logprobs,
  # seed, frequency/presence penalties, temperature above 1,
  # parallel_tool_calls: true) instead of excluding it, and list them in
  # the X-Switchyard-Dropped-Params response header. Default false.
  # temperature and top_p are always removed for a deployment without the
  # sampling capability, whatever this says.
  drop_unsupported_params: false

  # Whole-request deadline, across every attempt, backoff and the full
  # streamed response. A client's X-Switchyard-Timeout-Ms header can only
  # lower it. A request that runs out of time gets 504 timeout. Default 10m.
  request_timeout: 10m

  # Retries and fallback. A request is tried on a plan of deployments of the
  # requested model, the cheapest first; each fallback slot prefers a
  # provider not already in the plan. A pinned model@provider is a plan of
  # one, and fallback never switches to another model.
  fallback:
    # Plan length, primary plus fallbacks: 1 to 10. Default 3.
    max_deployments: 3
    # Retries of the same deployment after a transport error, a timeout or
    # a 5xx (or a 429 whose Retry-After fits the remaining deadline),
    # before the next deployment is tried: 0 to 5. Default 1.
    retries_per_deployment: 1
    # Exponential backoff with full jitter: retry n sleeps a random time in
    # [0, min(backoff_max, backoff_base × 2^n)], never past the deadline.
    # Defaults 250ms and 2s.
    backoff_base: 250ms
    backoff_max: 2s
    # Retry budget: retries to one deployment may not exceed this fraction
    # of its requests over a sliding 10 s window, in (0, 1]; once spent,
    # the gateway falls back instead of retrying. Default 0.2.
    retry_budget_ratio: 0.2
    # Retries per window that are always allowed. Default 5.
    retry_budget_min: 5

  # Circuit breaker, one per deployment and replica. Only transport errors,
  # timeouts, 5xx and upstream 401/402/403 count as failures. It opens after
  # consecutive_failures in a row, or at failure_ratio over at least
  # min_requests within window; stays open for open_for; then lets
  # half_open_probes concurrent requests through: one success closes it,
  # one failure opens it again.
  breaker:
    consecutive_failures: 5   # default 5
    failure_ratio: 0.5        # default 0.5, in (0, 1]
    min_requests: 20          # default 20
    window: 30s               # default 30s
    open_for: 30s             # default 30s
    half_open_probes: 3       # default 3

  # After a 429 the deployment is skipped for min(Retry-After, max), or for
  # default when the 429 has no Retry-After.
  rate_limit_cooldown:
    default: 1s   # default 1s
    max: 30s      # default 30s

  # Routing profiles (DESIGN §9.3): a quality bar, an objective and an
  # optional latency target. Clients pick one with model "auto:<name>" or
  # the X-Switchyard-Profile header; plain "auto" uses the policy's
  # profile, else default_profile. Omit profiles to get exactly these four
  # built-ins; configured profiles replace them all.
  #   min_quality  the bar the estimated quality q̂ must reach, in [0, 1]
  #   objective    cost (cheapest eligible, default) | latency (fastest
  #                estimated time to first token)
  #   max_ttft_ms  soft latency target in milliseconds; 0 (default) is none
  profiles:
    cheap:    { min_quality: 0.65, objective: cost }
    balanced: { min_quality: 0.80, objective: cost }
    quality:  { min_quality: 0.92, objective: cost }
    fast:     { min_quality: 0.80, objective: latency, max_ttft_ms: 800 }
  # The profile for plain "auto" when a policy names none. Default balanced.
  default_profile: balanced
  # Output tokens assumed for routing cost estimates when a request sets no
  # max_tokens; with max_tokens, the smaller of the two. Budget admission
  # still prices the output at max_tokens. Default 500.
  expected_output_tokens: 500
  # The request assessor (DESIGN §10.3): heuristic, the only type. Its
  # signal weights, each in [-1, 1], override the defaults listed in the
  # README's Quality scoring section: length, code, math, reasoning_cues,
  # constraints, conversation_depth, tools, strict_schema, simple_task,
  # creative and bias.
  assessor:
    type: heuristic
    weights:
      length: 0.25

  # SSE keep-alives for a slow first token. With a positive interval, a
  # stream that has not received its first upstream event after that long
  # is committed: 200, the SSE headers and a ": keep-alive" comment, repeated
  # every interval until the first event. This is a trade-off: after the
  # first keep-alive no fallback is possible, and a later failure becomes an
  # error event in the stream. Use it only for intermediaries with short
  # idle timeouts. 0s (default) is off; otherwise at least 10ms.
  stream_keepalive: 0s

# Policies (DESIGN §13): governance attached to tenants and keys. A key's
# policy replaces its tenant's; a tenant without one uses the policy with
# id "default", else built-in defaults (the default profile, everything
# allowed, pinned substitution, enforce, best_effort, no baseline_model,
# so no auto routing). Keys per policy:
#   id                        names the policy; same rules as a tenant id
#   profile                   the profile for plain "auto"
#   allowed_profiles          profiles callers may select; default all
#   allow, deny               globs over deployment ids (model@provider);
#                             default allow all; deny wins
#   prefer                    ordered globs; earlier ones form higher
#                             preference tiers, and cost decides within one
#   require_tags              tags every deployment must carry (provider
#                             tags plus deployment tags)
#   substitution              mode: pinned (default; only the requested
#                             model) | equivalent (any allowed model whose
#                             estimated quality is within max_quality_drop,
#                             default 0.05, of the requested model's)
#   routing_mode              enforce (default) | observe: serve what was
#                             asked for (the baseline for auto), record what
#                             routing would have chosen and the projected
#                             savings
#   baseline_model            the savings baseline, and the model observe
#                             mode serves for auto; required for auto
#   max_cost_per_request_usd  hard cap on a request's estimated cost
#   on_unmet                  best_effort (default: relax the latency target,
#                             then the quality bar) | reject (400)
#   rules                     governance rules (the first match applies),
#                             then quality rules on top; see below and the
#                             README
# Request headers can only tighten a policy: X-Switchyard-Profile (an
# allowed profile), X-Switchyard-Max-Cost-Usd (a lower cap),
# X-Switchyard-Min-Quality (a higher bar, up to the best min_quality among
# the allowed profiles, or the soft profile's during a budget downgrade),
# X-Switchyard-Max-TTFT-Ms (a shorter target). A value that would loosen
# it is ignored, with an X-Switchyard-Policy-Warning response header. A
# matching rule's profile replaces the one the request selects.
policies:
  - id: default
    profile: balanced
    allowed_profiles: [cheap, balanced, quality, fast]
    deny: ["*@gpu-cluster"]
    prefer: ["claude-*"]
    substitution: { mode: pinned, max_quality_drop: 0.05 }
    routing_mode: enforce
    baseline_model: claude-sonnet-5-5
    max_cost_per_request_usd: "0.50"
    on_unmet: best_effort
    # Two layers of rules. Governance rules match on who is asking and
    # what they asked for (model, profile, key, key_tags, header, tags,
    # stream, has_tools, has_images); the first that matches applies, and
    # it may set anything. Quality rules match on what the request is
    # (task, difficulty_gte, difficulty_lt, est_input_tokens_gte, with any
    # governance condition too) and may set only min_quality and prefer;
    # the first that matches applies on top of the governance rule, so
    # request content or client hints can never skip a governance rule.
    # Clients set headers and tags themselves: a rule matching them should
    # only restrict, and comes before rules it must not shadow.
    rules:
      # Autocomplete traffic must answer fast and cheaply.
      - name: autocomplete
        match: { tags: { feature: autocomplete }, stream: "true" }
        set: { profile: fast, max_cost_per_request_usd: "0.01" }
      # Staging traffic always takes the cheap profile, whatever profile
      # the request selects.
      - name: staging-is-cheap
        match: { header: { x-env: staging } }
        set: { profile: cheap }
      # A quality rule: hard coding requests need a higher bar than their
      # profile's.
      - name: code-needs-quality
        match: { task: coding, difficulty_gte: 0.5 }
        set: { min_quality: 0.85 }
  # Onboarding: route nothing, measure what routing would save. Concrete
  # model names may be served by an equivalent model once enforced.
  - id: observe
    routing_mode: observe
    baseline_model: claude-sonnet-5-5
    substitution: { mode: equivalent, max_quality_drop: 0.05 }
  # Batch jobs: the cheap profile only, zero-data-retention providers
  # only, and a 400 rather than a weaker model when nothing qualifies.
  - id: batch
    profile: cheap
    allowed_profiles: [cheap]
    require_tags: [zdr]
    baseline_model: claude-sonnet-5-5
    on_unmet: reject

# Tenants own the gateway API keys that clients send as
# "Authorization: Bearer sy_…". Config stores only each key's SHA-256 hash;
# `switchyard keys generate` creates a key, prints it once and prints the
# entry to paste here. With no tenants, every /v1 request gets 401.
# Keys per tenant:
#   id     names the tenant in logs and reports; 1 to 63 characters from
#          a-z, 0-9, _ and -, starting with a letter or digit; unique
#   keys   the tenant's API keys; a tenant without keys gets a warning
#   budgets  spend limits, at most one per scope and window (DESIGN §12.3)
# Keys per key:
#   id     names the key in logs and reports (never the key itself); same
#          rules as the tenant id, and unique across all tenants
#   hash   "sha256:" and 64 lowercase hex characters; unique across all
#          tenants. Never put the key itself here.
#   tags   matched by policy rules (key_tags), e.g. prod, eu
#   policy  a policy that replaces the tenant's for this key
# Keys per budget:
#   scope         tenant (the tenant's total spend) | key (each key's own)
#   window        day | month, calendar periods in UTC
#   limit_usd     the cap in USD, an exact decimal; > 0, at most 1000000000
#   soft_at       optional fraction in (0, 1): reaching soft_at × limit is
#                 logged and counted once per window
#   soft_profile  optional, with soft_at: once the soft threshold has been
#                 crossed in the window, auto requests use this profile
#   on_exhausted  block (default): a request whose estimated cost does not
#                 fit gets 429 budget_exceeded, with Retry-After until the
#                 window resets | notify: it is served, logged and counted
# A request is admitted at its estimated cost (output priced at max_tokens
# when set, else 500 tokens, for each of its n choices) before its first
# upstream attempt, and settled at its actual cost when it ends; at its
# estimate if an upstream had it but never served it (the client went
# away, a timeout, a 5xx), since it may have been billed anyway.
# Deployments without prices can't be budget-controlled precisely: under a
# block budget they are admitted and settled at 1 micro-USD. catalog lint
# flags them.
# To revoke a key, delete its entry and restart.
# The hashes below belong to keys nobody has: replace them with your own.
tenants:
  - id: acme
    # The policy of this tenant's keys. Default: the policy with id
    # "default", else built-in defaults.
    policy: default
    keys:
      - id: acme-backend
        hash: sha256:0f7d5a33e1ad68ae7b2a4b139d4c5bf17737e0db942bfbecc5792bb3436d3e59
        tags: [prod]
      - id: acme-ci
        hash: sha256:0eb9387d9e4b212cd42007efc1e129c69f55b64724268d2b9edbdc45fda4a0c2
        policy: observe
    budgets:
      - scope: tenant
        window: month
        limit_usd: "2000"
        soft_at: 0.8
        soft_profile: cheap
        on_exhausted: block
      - scope: key
        window: day
        limit_usd: "50"
        on_exhausted: notify

# Budget settings for every tenant.
budgets:
  # What a request gets while the budget store (the Redis state instance)
  # is unavailable: open (default) serves it unchecked, logs a warning and
  # counts switchyard_budget_store_errors_total; closed answers 503
  # budget_unavailable. After a failure, or no answer within 1s, the store
  # is skipped for 5s, then one request tries it again.
  fail_mode: open
