# Switchyard model catalog, included by configs/switchyard.example.yaml.
#
# Illustrative entries: the IDs show the shape of the catalog and are not a
# curated list. This is the Phase 0 skeleton, so each model has only an ID
# and its deployments. Pricing, capabilities, context windows and quality
# priors arrive in Phase 2.
#
# A model's ID is what clients send in the "model" field. Each deployment
# names a provider defined in the main config and the model name sent
# upstream; its deployment ID is model@provider.
models:
  - id: llama-3.3-70b
    deployments:
      - provider: gpu-cluster
        upstream_model: meta-llama/Llama-3.3-70B-Instruct
      - provider: together
        upstream_model: meta-llama/Llama-3.3-70B-Instruct-Turbo

  - id: claude-sonnet-5-5
    deployments:
      - provider: anthropic
        upstream_model: claude-sonnet-5-5

  - id: gemini-2.5-flash
    deployments:
      - provider: google
        upstream_model: gemini-2.5-flash

  - id: gpt-5-mini
    deployments:
      - provider: openai
        upstream_model: gpt-5-mini

  - id: text-embedding-3-small
    deployments:
      - provider: openai
        upstream_model: text-embedding-3-small
