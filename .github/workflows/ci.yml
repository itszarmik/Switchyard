# Continuous integration: build, test, lint, vulnerability scan, module
# tidiness and the container image. CI never calls a real provider.
#
# Every action is pinned by its full commit SHA, with its release tag in
# the comment; release.yml says how to bump them. Go is pinned too: 1.27.4,
# the Dockerfile's, plus the newest 1.26 patch, the oldest release go.mod
# supports.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.26.x is the oldest release go.mod supports; 1.27.4 is the one
        # the image and the release are built with.
        go: ["1.26.x", "1.27.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Validate sample configs
        # Placeholder values only: the example config requires these
        # variables, and validation never connects to anything.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          OPENAI_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          TOGETHER_API_KEY: ci-placeholder
        run: |
          go run ./cmd/switchyard config validate -c configs/quickstart.yaml
          go run ./cmd/switchyard config validate -c configs/switchyard.example.yaml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      # golangci-lint v2 also reports gofmt and goimports differences.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      - name: govulncheck
        run: go tool govulncheck ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      - name: go mod tidy
        run: go mod tidy -diff

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build and the same size and UID checks as locally.
      - name: Build image and check size and user
        run: make docker-check
