# Continuous integration: build, test, lint, vulnerability scan, module
# tidiness, the container image and the Helm chart. CI never calls a real
# provider.
#
# Every action is pinned by its full commit SHA, with its release tag in
# the comment; release.yml says how to bump them. Go is pinned too: 1.27.4,
# the Dockerfile's, plus the newest 1.26 patch, the oldest release go.mod
# supports.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.26.x is the oldest release go.mod supports; 1.27.4 is the one
        # the image and the release are built with.
        go: ["1.26.x", "1.27.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Validate sample configs
        # Placeholder values only: the example config requires these
        # variables, and validation never connects to anything.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          OPENAI_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          TOGETHER_API_KEY: ci-placeholder
        run: |
          go run ./cmd/switchyard config validate -c configs/quickstart.yaml
          go run ./cmd/switchyard config validate -c configs/switchyard.example.yaml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      # golangci-lint v2 also reports gofmt and goimports differences.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      - name: govulncheck
        run: go tool govulncheck ./...

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      - name: go mod tidy
        run: go mod tidy -diff

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build and the same size and UID checks as locally.
      - name: Build image and check size and user
        run: make docker-check

  # The Helm chart: lint, render tests and kubeconform (make helm-lint),
  # then the install test on a throwaway kind cluster (make helm-test).
  # helm, kind, kubectl and kubeconform are pinned; kubeconform is built
  # with go install, which checks it against the Go checksum database.
  # Locally make helm-test takes about 3 minutes with warm image caches:
  # the cluster, then about 130 s of test, most of it the upgrade under
  # load and the failed upgrade's 40 s wait. Cold caches here add the image
  # builds and the image pulls.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
          checksum-policy: required
      # Only installs kind and kubectl: make helm-test creates the cluster
      # from test/helm/testdata/kind.yaml and deletes it.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.2
          install_only: true
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: make helm-lint
        run: make helm-lint
      - name: make helm-test
        run: make helm-test
