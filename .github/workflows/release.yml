# Release: on a v* tag, run every pre-merge check, check the Helm chart
# (lint, render tests, kubeconform, the kind install test) and package it,
# then GoReleaser (.goreleaser.yaml): binaries, archives, checksums,
# CycloneDX SBOMs, a draft GitHub release with the packaged Helm chart
# attached, and multi-arch images on ghcr.io built with Buildx and QEMU,
# published as ghcr.io/itszarmik/switchyard. Written for v0.1.0; the chart
# since v0.2.0.
#
# Supply chain: every action is pinned by its full commit SHA, with the
# release tag it was resolved from in the comment, so a moved tag cannot
# change what runs. The checks, and the chart's packaging with helm, run in
# their own job, with a read-only token; the packaged chart reaches the
# release job as a workflow artifact. Only the release job gets write
# access, and it runs nothing but GoReleaser, its setup and that download. To bump an action, resolve the new tag's commit with
#
#   git ls-remote https://github.com/<owner>/<action> 'refs/tags/vX.Y.Z' 'refs/tags/vX.Y.Z^{}'
#
# (the ^{} line, when present, is the commit of an annotated tag) and
# update the SHA and the comment together, here and in ci.yml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # make check (up to 15 minutes in ci.yml) plus the helm checks (up to 30).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The Dockerfile's Go; go.mod's go line is the minimum, not this.
          go-version: 1.27.4
          cache: true
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: make check
        run: make check
      # The same chart checks as ci.yml's helm job, so a chart that fails
      # kubeconform or the kind install test is never released.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
          checksum-policy: required
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.2
          install_only: true
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: make helm-lint
        run: make helm-lint
      - name: make helm-test
        run: make helm-test
      - name: Package the Helm chart
        # At the tag's version (v0.2.0 -> 0.2.0), as chart version and
        # appVersion. The tag must be v<semantic version>; the name is
        # checked before it reaches make.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'; then
            echo "::error::the tag is not v<semantic version>, such as v0.2.0"
            exit 1
          fi
          make helm-package CHART_VERSION="$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: bin/chart/switchyard-*.tgz
          if-no-files-found: error

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the images on ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser's changelog needs the history and the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true
      # The chart the check job packaged, fetched before any registry login,
      # into bin/chart: GoReleaser attaches bin/chart/switchyard-<version>.tgz
      # and fails the release if the tag's version is missing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: bin/chart
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser
        # The version the Makefile pins (GORELEASER_VERSION), run with go run
        # so it never enters go.mod.
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.2 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
